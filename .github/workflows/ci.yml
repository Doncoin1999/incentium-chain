name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format
        run: cargo fmt --all -- --check
      - name: Economics crate builds without std
        run: cargo build -p ict-economics --no-default-features
      - name: Tests (native runtime)
        run: SKIP_WASM_BUILD=1 cargo test --workspace
      - name: Clippy
        run: SKIP_WASM_BUILD=1 cargo clippy --workspace --all-targets -- -D warnings
      - name: Benchmarks run in the pallet test runtimes
        run: >
          SKIP_WASM_BUILD=1 cargo test --features runtime-benchmarks
          -p pallet-ict-emission -p pallet-subnet-registry -p pallet-weights
          -p pallet-work-verify -p pallet-ict-consensus -p incentium-runtime

  benchmark-runtime:
    # The runtime with benchmarks compiled in, for scripts/run-benchmarks.sh.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build runtime with benchmarks
        run: cargo build --release -p incentium-runtime --features runtime-benchmarks
      - uses: actions/upload-artifact@v4
        with:
          name: incentium-runtime-benchmarks
          path: target/release/wbuild/incentium-runtime/incentium_runtime.compact.compressed.wasm

  neuron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest substrate-interface && cd neuron && python -m pytest -q
      - run: cd scripts && python -m pytest -q

  windows-installer:
    # runs scripts/install-node.ps1 from this commit in Windows PowerShell 5.1, the way users run it
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, check the dashboard, uninstall
        shell: powershell
        env:
          INCENTIUM_CI: "1"
          INCENTIUM_NO_BROWSER: "1"
          INCENTIUM_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          INCENTIUM_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content -Raw scripts/install-node.ps1 | Invoke-Expression
          $d = "$env:USERPROFILE\.incentium-node"
          $token = (Get-Content -Raw "$d\config.json" | ConvertFrom-Json).token
          $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7777/?t=$token"
          if ($r.StatusCode -ne 200) { throw "dashboard returned $($r.StatusCode)" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Startup'))\Incentium Node.lnk")) { throw 'no startup shortcut' }
          Get-Content "$d\node.log" -Tail 20
          $env:INCENTIUM_UNINSTALL = '1'
          Get-Content -Raw scripts/install-node.ps1 | Invoke-Expression
          if (Test-Path $d) { throw 'uninstall left files behind' }

  devnet-smoke:
    # Builds the real wasm runtime and node, runs a dev chain with 10-block epochs and
    # checks that blocks are produced and ICT is issued.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build node (release, fast epochs)
        run: cargo build --release -p incentium-node --features fast-epochs
      - name: Run dev chain and check block production
        run: |
          ./target/release/incentium-node --dev --tmp --rpc-port 9944 > node.log 2>&1 &
          for i in $(seq 1 60); do
            n=$(curl -s -H 'Content-Type: application/json' \
              -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader","params":[]}' \
              http://127.0.0.1:9944 | python3 -c 'import sys,json;print(int(json.load(sys.stdin)["result"]["number"],16))' 2>/dev/null || echo 0)
            echo "block $n"; [ "$n" -ge 5 ] && exit 0; sleep 5
          done
          tail -50 node.log; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: incentium-node-fast-epochs
          path: target/release/incentium-node
      # Testnet and mainnet run the normal 360-block (72-minute) epochs.
      - name: Build node (release, normal epochs)
        run: cargo build --release -p incentium-node
      - name: Check the testnet chain spec builds
        run: |
          ./target/release/incentium-node export-chain-spec --chain bootstrap-template > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: incentium-node
          path: target/release/incentium-node

