<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incentium Swap · ICT ⇄ USDC</title>
<meta name="description" content="Trade ICT for USDC on Base by atomic swap: no bridge, no custodian.">
<link rel="stylesheet" href="/style.css">
<style>
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 24px; }
  form.stack { display: flex; flex-direction: column; gap: 14px; }
  form.stack label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
  form.stack input, form.stack select { height: 44px; padding: 0 12px; background: var(--slate); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font: 15px var(--sans); }
  form.stack input.mono { font: 14px var(--mono); }
  .steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .steps li.done { color: var(--good); } .steps li.now { color: var(--lamp); }
  .warn { border-color: var(--lamp-dim); }
  .ok { color: var(--good); } .err { color: var(--bad); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 24px; max-width: 560px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
</style>
</head>

      <b>Incentium</b><span>Swap</span>
    </a>
    <nav class="main" aria-label="Main">
      <a href="#/" data-nav="book">Order book</a>
      <a href="#/new" data-nav="new">Place order</a>
      <a href="#/me" data-nav="me">My orders</a>
