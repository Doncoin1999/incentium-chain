[package]
name = "pallet-block-producers"
description = "Open block production: the genesis keys' reserve, the offline rule and a minimum slash (docs/OPEN-BLOCK-PRODUCTION.md)."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
polkadot-sdk = { version = "2610.0.0", default-features = false, features = ["frame-support", "frame-system", "sp-runtime", "sp-staking", "pallet-staking", "pallet-session"] }

[features]
default = ["std"]
std = ["codec/std", "scale-info/std", "polkadot-sdk/std"]
runtime-benchmarks = ["polkadot-sdk/runtime-benchmarks"]
try-runtime = ["polkadot-sdk/try-runtime"]
