[package]
name = "pallet-ipm-emission"
description = "IPM issuance: per-block reward with supply-triggered halving, split to fund and subnet pot."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
polkadot-sdk = { version = "2610.0.0", default-features = false, features = ["frame-support", "frame-system", "sp-runtime"] }
ipm-economics = { path = "../../primitives/ipm-economics", default-features = false }

[dev-dependencies]
polkadot-sdk = { version = "2610.0.0", features = ["frame-support", "frame-system", "sp-runtime", "sp-io", "sp-core", "pallet-balances", "std"] }

[features]
default = ["std"]
std = ["codec/std", "scale-info/std", "polkadot-sdk/std", "ipm-economics/std"]
