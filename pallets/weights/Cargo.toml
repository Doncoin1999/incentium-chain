[package]
name = "pallet-weights"
description = "Validator weights with commit-reveal per epoch (hash-based; drand time-lock planned)."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
polkadot-sdk = { version = "2610.0.0", default-features = false, features = ["frame-support", "frame-system", "sp-runtime", "sp-io", "sp-core"] }
pallet-subnet-registry = { path = "../subnet-registry", default-features = false }

[dev-dependencies]
polkadot-sdk = { version = "2610.0.0", features = ["frame-support", "frame-system", "sp-runtime", "sp-io", "sp-core", "pallet-balances", "std"] }
ipm-economics = { path = "../../primitives/ipm-economics" }

[features]
default = ["std"]
std = ["codec/std", "scale-info/std", "polkadot-sdk/std", "pallet-subnet-registry/std"]
