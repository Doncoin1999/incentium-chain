[package]
name = "pallet-endpoints"
description = "On-chain register of public RPC, archive and bootnode endpoints, with probe reports and a daily payout by availability (spec Section 19)."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
polkadot-sdk = { version = "2610.0.0", default-features = false, features = ["frame-support", "frame-system", "sp-runtime", "sp-io", "sp-core"] }

[dev-dependencies]
polkadot-sdk = { version = "2610.0.0", features = ["frame-support", "frame-system", "sp-runtime", "sp-io", "sp-core", "pallet-balances", "pallet-timestamp", "std"] }

[features]
default = ["std"]
std = ["codec/std", "scale-info/std", "polkadot-sdk/std"]
runtime-benchmarks = ["polkadot-sdk/runtime-benchmarks"]
