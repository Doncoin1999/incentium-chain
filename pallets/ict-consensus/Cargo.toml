[package]
name = "pallet-ict-consensus"
description = "Validator staking and per-epoch Yuma-lite consensus with reward payout for SN0."
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
polkadot-sdk = { version = "2610.0.0", default-features = false, features = ["frame-support", "frame-system", "sp-runtime", "sp-io", "sp-core"] }
pallet-subnet-registry = { path = "../subnet-registry", default-features = false }
ict-economics = { path = "../../primitives/ict-economics", default-features = false }
pallet-weights = { path = "../weights", default-features = false }
pallet-work-verify = { path = "../work-verify", default-features = false }

[dev-dependencies]
polkadot-sdk = { version = "2610.0.0", features = ["frame-support", "frame-system", "sp-runtime", "sp-io", "sp-core", "pallet-balances", "std"] }

[features]
default = ["std"]
std = ["ict-economics/std", "pallet-weights/std", "pallet-work-verify/std", "codec/std", "scale-info/std", "polkadot-sdk/std", "pallet-subnet-registry/std"]
runtime-benchmarks = ["polkadot-sdk/frame-benchmarking", "polkadot-sdk/runtime-benchmarks", "pallet-subnet-registry/runtime-benchmarks", "pallet-weights/runtime-benchmarks", "pallet-work-verify/runtime-benchmarks"]
