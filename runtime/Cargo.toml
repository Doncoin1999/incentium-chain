[package]
name = "incentium-runtime"
description = "Incentium runtime: Aura/Grandpa solochain with the Incentium pallets."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive", "serde"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
polkadot-sdk = { version = "2610.0.0", default-features = false, features = [
    "experimental",
    "frame-executive",
    "frame-metadata-hash-extension",
    "frame-support",
    "frame-system",
    "frame-system-rpc-runtime-api",
    "pallet-aura",
    "pallet-authorship",
    "pallet-bags-list",
    "pallet-offences",
    "pallet-session",
    "pallet-staking",
    "frame-election-provider-support",
    "sp-staking",
    "sp-npos-elections",
    "pallet-balances",
    "pallet-bounties",
    "pallet-child-bounties",
    "pallet-conviction-voting",
    "pallet-grandpa",
    "pallet-multisig",
    "pallet-preimage",
    "pallet-referenda",
    "pallet-scheduler",
    "pallet-sudo",
    "pallet-timestamp",
    "pallet-transaction-payment",
    "pallet-transaction-payment-rpc-runtime-api",
    "pallet-treasury",
    "sp-api",
    "sp-block-builder",
    "sp-consensus-aura",
    "sp-consensus-grandpa",
    "sp-core",
    "sp-genesis-builder",
    "sp-inherents",
    "sp-io",
    "sp-keyring",
    "sp-offchain",
    "sp-runtime",
    "sp-session",
    "sp-storage",
    "sp-transaction-pool",
    "sp-version",
] }
ict-economics = { path = "../primitives/ict-economics", default-features = false }
pallet-ict-emission = { path = "../pallets/ict-emission", default-features = false }
pallet-subnet-registry = { path = "../pallets/subnet-registry", default-features = false }
pallet-weights = { path = "../pallets/weights", default-features = false }
pallet-work-verify = { path = "../pallets/work-verify", default-features = false }
pallet-ict-consensus = { path = "../pallets/ict-consensus", default-features = false }
pallet-ict-swap = { path = "../pallets/ict-swap", default-features = false }
pallet-block-producers = { path = "../pallets/block-producers", default-features = false }

[build-dependencies]
substrate-wasm-builder = { version = "35.0.0", optional = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "serde_json/std",
    "polkadot-sdk/std",
    "ict-economics/std",
    "pallet-ict-emission/std",
    "pallet-subnet-registry/std",
    "pallet-weights/std",
    "pallet-work-verify/std",
    "pallet-ict-consensus/std",
    "pallet-ict-swap/std",
    "pallet-block-producers/std",
    "substrate-wasm-builder",
]
metadata-hash = ["substrate-wasm-builder/metadata-hash"]
# Devnet/CI only: 10-block epochs so a full commit-reveal-settle cycle takes minutes.
fast-epochs = []
runtime-benchmarks = [
    "polkadot-sdk/runtime-benchmarks",
    "polkadot-sdk/frame-benchmarking",
    "pallet-ict-emission/runtime-benchmarks",
    "pallet-subnet-registry/runtime-benchmarks",
    "pallet-weights/runtime-benchmarks",
    "pallet-work-verify/runtime-benchmarks",
    "pallet-ict-consensus/runtime-benchmarks",
    "pallet-ict-swap/runtime-benchmarks",
]
